name: ft_main_s335m_qa_replay
seed: 1939
base:
  run: main_s335m
  checkpoint: step_045776.pt
model:
  name: s335m
  type: transformer
  vocab_size: 49152
  context: 4096
  n_layer: 24
  d_model: 1024
  n_head: 16
  ffn_hidden: 2688
  rope_base: 10000.0
data:
  period:
    source: american_stories
    min_pairs: 2
    question_chars:
    - 8
    - 400
    answer_chars:
    - 2
    - 1000
    testimony_share: 0.4
    overlap: 0.5
    dev_share: 0.02
  caqa:
    dir: data/eval/chroniclingamerica_qa
    train: 40000
    eval: 2000
    context_tokens: 1024
    dev_share: 0.02
lr: 3.0e-05
warmup_steps: 30
min_lr_ratio: 0.1
epochs: 2
batch_rows: 32
micro_batch_rows: 1
betas:
- 0.9
- 0.95
weight_decay: 0.1
grad_clip: 1.0
dev_every_steps: 50
checkpoint_every_steps: 100
log_gpu_temp_every_steps: 10
balance_decades: true
replay:
  stream: main
  rows_per_step: 16
  weight: 1.0
val_rows: 32
