# Shared by every neural model. Override per run in runs/<name>/config.yaml.
precision: bf16
optimizer: adamw
lr: 6.0e-4          # the 335M rung uses 3.0e-4; the baselines take theirs from 200M-token probes
micro_batch_rows: 64     # rows of `context` tokens per forward pass; the Transformer uses 1 (memory)
tokens: 12.0e+9          # seen tokens per run (CLAUDE.md rule 7)
stream: main
betas: [0.9, 0.95]
weight_decay: 0.1
warmup_steps: 1000
schedule: cosine
min_lr_ratio: 0.1
grad_clip: 1.0
batch_tokens: 262144     # 2^18 tokens per optimizer step (grad accumulation)
checkpoint_every_steps: 500
eval_every_steps: 500
log_gpu_temp_every_steps: 100
max_run_hours_without_resume_test: 8
seed: 1939
