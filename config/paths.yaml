# All paths live here. Never hard-code a path in src/.
# Fill in the [[TODO]] values before Phase 0.

data_root: ./data
raw: ./data/raw
dedup: ./data/dedup
filtered: ./data/filtered
translated: ./data/translated
tokenized: ./data/tokenized
splits_manifest: ./data/splits/MANIFEST.json
runs: ./runs
reports: ./reports
probes: ./probes

# Approved corpora (HF repo, pinned revision, file table, raw destination).
# The native-English backbone is `american_stories`; the rest are training-only.
sources: ./config/sources.yaml
ingested_american_stories: ./data/ingested/american_stories
ingested_root: ./data/ingested           # <root>/<source>/ for every source

# Machines (decided 2026-10-05, HANDOFF §12): the RTX 5080 box is the remote
# host; it downloads, processes all data and trains. Code lives in WSL there.
remote_host: gpu                 # SSH alias; login shell is Windows cmd, Linux via `wsl -d Ubuntu --`
remote_workdir: /home/an/1939

# Downloads on the remote box (src/data/download.py). WSL (NAT mode) cannot
# reach the Windows-side proxy; Windows curl.exe launched from WSL can.
download:
  proxy: http://127.0.0.1:7890
  hf_endpoint: https://huggingface.co
  hf_mirror: https://hf-mirror.com
  years: "1923-1955,1922-1900"   # boundary decades first

# Translation machine: still open (HANDOFF §11). Inference only.
translate_host: "[[TODO: undecided]]"
translate_workdir: "[[TODO: undecided]]"

# Translator pin (fill with the exact HF revision hash once chosen)
nmt_model: facebook/nllb-200-distilled-600M
nmt_revision: "[[TODO: commit hash]]"

# Temporal boundary (ISO dates; do not change without updating HANDOFF.md)
cutoff: 1939-06-30
embargo_start: 1939-07-01
embargo_end: 1939-08-31
test_start: 1939-09-01
year_range: [1900, 1955]
holdout_fraction_per_year: 0.02
val_fraction: 0.02
