# Training mixture (user decisions 2026-10-08, HANDOFF §12; CLAUDE.md rule 7). Seen tokens.
# Token counts are word counts x tokens_per_word until the 48k BPE exists (decision 5: re-run then).

tokens_per_word: {en: 1.35, de: 1.6}
half_life_years: 5            # within a period, sampling order by weight ∝ exp(-(1939 - year) / 5)
reference_year: 1939
seed: 20261008
repeat_from_year: 1934        # second epoch only for 1934-01-01 … 1939-06-30
max_epochs: 2

profile: 12B
profiles:
  12B:
    budget: 12.0e+9
    periods: {"1930-39.06": 7.37e+9, "1920-29": 2.6e+9, "1900-19": 0.8e+9}
    science: {en: 0.85e+9, de: 0.30e+9}
    fill_to_budget: "1920-29"   # user 2026-10-08: the caps leave the 1930s at ~6.6B; the 1920s take the rest
    fill_max_share: 0.35        # of the budget (the 1920s cap of the 2026-10-05 mixture)
  10B:                        # "if the user overrides back to 10B": only the 1920s and pre-1920 move
    budget: 10.0e+9
    periods: {"1930-39.06": 7.37e+9, "1920-29": 1.4e+9, "1900-19": 0.35e+9}
    science: {en: 0.85e+9, de: 0.30e+9}

caps:                         # per period, shares of the period's seen tokens
  german: 0.25
  books: 0.12                 # English books (category books); German books are counted as German
  legal_of_english: 0.10      # category legal (case law, Federal Register) vs the period's English
  legal_absolute: {"1930-39.06": 0.35e+9}
  science_of_language: 0.10   # science <= 10 % of each language's seen tokens; the profile's science targets
                              # are upper bounds below that

# Science: tiers in order; within a tier uniform random order (no recency weighting). "*" = every other
# science source of that language.
science_tiers:
  en:
    - [pnas_ia, nature_ia, jstor_ejc]
    - ["*"]
    - [gutenberg_sci_en, pre_1929_books, loc_pd_books]
  de:
    - [annalen_physik_ia, jfm]
    - ["*"]
    - [gutenberg_sci_de]
