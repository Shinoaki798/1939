# Model size follows data: ~20 tokens / parameter, never more than 2 epochs.
# After the Phase-1 audit, set `selected` to the rung whose token range
# contains the usable pre-1939 token count (v2 if frozen, else v1).

tokens_per_param: 20
max_epochs: 2
context_length: 4096     # HANDOFF §12 2026-10-14 (user; was 2048)
vocab_size: 49152        # byte-level BPE, chosen 2026-10-08 (reports/tokenizer_compare.md)

rungs:
  - name: s90m
    max_tokens_b: 1.5
    n_layer: 12
    d_model: 640
    n_head: 10
    est_hours_5080: 4
  - name: s160m
    max_tokens_b: 3.0
    n_layer: 16
    d_model: 768
    n_head: 12
    est_hours_5080: 8
  - name: s250m
    max_tokens_b: 6.0
    n_layer: 20
    d_model: 896
    n_head: 14
    est_hours_5080: 18
  - name: s335m
    max_tokens_b: 99
    n_layer: 24
    d_model: 1024
    n_head: 16
    est_hours_5080: 40

selected: s335m  # 24 x 1024 x 16 heads, ~350M (HANDOFF §12 2026-10-05; CLAUDE.md rule 7: fixed at 350M)

transformer:            # the selected rung's remaining settings (src/model/transformer.py)
  ffn_hidden: 2688      # SwiGLU width, 8 d / 3 rounded down to a multiple of 64; 349,225,984 parameters in all
  rope_base: 10000.0

baselines:
  # instructor-mandated progression; same tokenizer, main stream and 12B tokens (decisions 2026-10-19).
  # hidden: width solved from V*h + n_layer*g*(2h^2 + 2h) = 50M (g = 1 RNN, 3 GRU, 4 LSTM), rounded to a
  # multiple of 32/64; tied embeddings, so the embedding width equals h.
  - {name: ngram_kn5, type: kenlm, order: 5, train_tokens: 1.0e+9}   # first 1B tokens of the main stream
  - {name: rnn_50m,  type: rnn,  n_layer: 2, hidden: 960, target_params_m: 50}    # 50,876,160
  - {name: lstm_50m, type: lstm, n_layer: 2, hidden: 800, target_params_m: 50}    # 49,574,400
  - {name: gru_50m,  type: gru,  n_layer: 2, hidden: 832, target_params_m: 50}    # 49,211,136
